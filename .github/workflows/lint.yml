name: lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ringo-org/github-actions-common/actions/change-file@main
      - uses: ringo-org/github-actions-common/actions/lint@main
        with:
          config-file: "eslint.config.ts"
